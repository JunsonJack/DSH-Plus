<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24">
  <title>DeepSeek DIY Glass Icon</title>
  <desc>DIY DeepSeek icon: black whale on a frosted-white glass tile (24x24, same spec as official)</desc>
  <defs>
    <!-- 玻璃底板：白色 -> 冷调浅灰的柔和渐变 -->
    <linearGradient id="dsd-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#F3F6FC"/>
      <stop offset="1" stop-color="#DEE6F3"/>
    </linearGradient>
    <!-- 斜向玻璃高光 -->
    <linearGradient id="dsd-sheen" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 顶部眩光 -->
    <radialGradient id="dsd-glare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 底部轻微压暗，增加厚度感 -->
    <linearGradient id="dsd-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#16264D" stop-opacity="0"/>
      <stop offset="1" stop-color="#16264D" stop-opacity="0.08"/>
    </linearGradient>
    <!-- 内侧亮边：玻璃倒角 -->
    <linearGradient id="dsd-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <!-- 外侧深色发丝线：白色桌面上也能看清轮廓 -->
    <linearGradient id="dsd-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1F42" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0F1F42" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="dsd-tile"><rect width="24" height="24" rx="5.391"/></clipPath>
    <filter id="dsd-whale-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0.281" stdDeviation="0.375" flood-color="#0B1B3A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 玻璃底板 -->
  <rect width="24" height="24" rx="5.391" fill="url(#dsd-base)"/>

  <g clip-path="url(#dsd-tile)">
    <path d="M0 0H24L0 24Z" fill="url(#dsd-sheen)"/>
    <ellipse cx="12" cy="4.031" rx="9.844" ry="3.656" fill="url(#dsd-glare)"/>
    <rect width="24" height="24" fill="url(#dsd-shade)"/>
  </g>

  <!-- 黑色鲸鱼（官方原路径，等比缩放居中） -->
  <g filter="url(#dsd-whale-shadow)">
    <g transform="translate(4.6875 4.6875) scale(0.609375)">
      <path fill="#000000" fill-rule="evenodd" d="M23.748 4.482c-.254-.124-.364.113-.512.234-.051.039-.094.09-.137.136-.372.397-.806.657-1.373.626-.829-.046-1.537.214-2.163.848-.133-.782-.575-1.248-1.247-1.548-.352-.156-.708-.311-.955-.65-.172-.241-.219-.51-.305-.774-.055-.16-.11-.323-.293-.35-.2-.031-.278.136-.356.276-.313.572-.434 1.202-.422 1.84.027 1.436.633 2.58 1.838 3.393.137.093.172.187.129.323-.082.28-.18.552-.266.833-.055.179-.137.217-.329.14a5.526 5.526 0 01-1.736-1.18c-.857-.828-1.631-1.742-2.597-2.458a11.365 11.365 0 00-.689-.471c-.985-.957.13-1.743.388-1.836.27-.098.093-.432-.779-.428-.872.004-1.67.295-2.687.684a3.055 3.055 0 01-.465.137 9.597 9.597 0 00-2.883-.102c-1.885.21-3.39 1.102-4.497 2.623C.082 8.606-.231 10.684.152 12.85c.403 2.284 1.569 4.175 3.36 5.653 1.858 1.533 3.997 2.284 6.438 2.14 1.482-.085 3.133-.284 4.994-1.86.47.234.962.327 1.78.397.63.059 1.236-.03 1.705-.128.735-.156.684-.837.419-.961-2.155-1.004-1.682-.595-2.113-.926 1.096-1.296 2.746-2.642 3.392-7.003.05-.347.007-.565 0-.845-.004-.17.035-.237.23-.256a4.173 4.173 0 001.545-.475c1.396-.763 1.96-2.015 2.093-3.517.02-.23-.004-.467-.247-.588zM11.581 18c-2.089-1.642-3.102-2.183-3.52-2.16-.392.024-.321.471-.235.763.09.288.207.486.371.739.114.167.192.416-.113.603-.673.416-1.842-.14-1.897-.167-1.361-.802-2.5-1.86-3.301-3.307-.774-1.393-1.224-2.887-1.298-4.482-.02-.386.093-.522.477-.592a4.696 4.696 0 011.529-.039c2.132.312 3.946 1.265 5.468 2.774.868.86 1.525 1.887 2.202 2.891.72 1.066 1.494 2.082 2.48 2.914.348.292.625.514.891.677-.802.09-2.14.11-3.054-.614zm1-6.44a.306.306 0 01.415-.287.302.302 0 01.2.288.306.306 0 01-.31.307.303.303 0 01-.304-.308zm3.11 1.596c-.2.081-.399.151-.59.16a1.245 1.245 0 01-.798-.254c-.274-.23-.47-.358-.552-.758a1.73 1.73 0 01.016-.588c.07-.327-.008-.537-.239-.727-.187-.156-.426-.199-.688-.199a.559.559 0 01-.254-.078c-.11-.054-.2-.19-.114-.358.028-.054.16-.186.192-.21.356-.202.767-.136 1.146.016.352.144.618.408 1.001.782.391.451.462.576.685.914.176.265.336.537.445.848.067.195-.019.354-.25.452z"/>
    </g>
  </g>

  <!-- 玻璃倒角与外轮廓 -->
  <rect x="0.188" y="0.188" width="23.625" height="23.625" rx="5.203" fill="none" stroke="url(#dsd-rim)" stroke-width="0.188"/>
  <rect x="0.047" y="0.047" width="23.859" height="23.859" rx="5.344" fill="none" stroke="url(#dsd-edge)" stroke-width="0.094"/>
</svg>
